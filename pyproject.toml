[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelml"
version = "1.0.0"
description = "Reliable ML delivery with quality-gated model promotion and drift intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "scikit-learn>=1.4,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "joblib>=1.3,<2.0",
  "pydantic>=2.6,<3.0",
  "openai>=1.68,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
